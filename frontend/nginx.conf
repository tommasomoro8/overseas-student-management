# ===========================================================================
# Configurazione Nginx per il serving in PRODUZIONE della SPA Angular.
#  - serve i file statici compilati (dist/frontend/browser)
#  - fa da reverse proxy: inoltra /api e /socket.io al container backend
#    così il browser usa sempre la stessa origine (niente CORS, niente URL
#    hard-coded), esattamente come il proxy del dev-server in sviluppo.
# Questo file viene copiato in /etc/nginx/conf.d/default.conf dal Dockerfile.
# ===========================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressione dei file testuali (HTML/JS/CSS/JSON)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API REST -> backend Express ---
    # 'backend' è il nome del servizio nella rete di docker-compose.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket Socket.IO -> backend (richiede gli header di Upgrade) ---
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA: ogni altra rotta ricade su index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
